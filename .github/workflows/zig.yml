name: Zig CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build default (ReleaseSmall + strip)
        run: zig build
      - name: Build release
        run: zig build -Doptimize=ReleaseSafe
      - name: Test
        run: zig build test
      - name: Memory-safety audit
        run: zig build memaudit
      - name: English-only visible text
        run: python3 tools/lang_check.py
      - name: Debug symbols (required)
        run: |
          zig build debug
          readelf -SW zig-out/bin/zode-debug | grep -q .debug_info
          readelf -SW zig-out/bin/zode-debug | grep -q .symtab
      - name: TUI smoke (required)
        run: zig build pty-check
      - name: Crash path (required)
        # src/main.zig has no unit tests: this real-pty probe is the only gate
        # on terminal restoration and the pc: entry in the crash log.
        run: python3 tools/segv_probe.py --bin ./zig-out/bin/zode-debug
      - name: RC gate (serialized)
        # One command that runs every v3 gate in order and stops at the first
        # red one. It also covers ui-frame, hooks, remote, the import seam and
        # the Windows cross-build, which the steps above do not exercise.
        run: zig build rc-check

  # Also test with version flag
  build-with-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build with version
        run: zig build -Dversion=test-version
      - name: Verify version in binary
        run: |
          ./zig-out/bin/zode --version | grep -q "test-version" || (echo "Version not found in binary" && exit 1)
