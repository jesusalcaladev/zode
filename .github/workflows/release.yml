name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # A tag must match the version in build.zig.zon. Without this guard a
      # churn bump can be forgotten and a `v0.3.0-beta.1` tag ships a binary
      # whose package metadata still says the previous version.
      - name: Version consistency
        run: |
          ZON_VERSION=$(grep -oP '\.version = "\K[^"]+' build.zig.zon)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION  zon=$ZON_VERSION"
          test "$TAG_VERSION" = "$ZON_VERSION" || {
            echo "ERROR: tag and build.zig.zon disagree; run churn version first" >&2
            exit 1
          }

      # `-Dcpu=baseline` IS NOT OPTIONAL HERE.
      #
      # With no `-Dtarget`, `zig build` compiles for the CPU OF THE RUNNER. The
      # GitHub runners are server chips with SHA-NI, AVX-512 and friends, so the
      # artifact carried `sha256msg1` and died with SIGILL on any older CPU (an
      # i5-8350U hit it in the TLS handshake, seconds after the first frame, with
      # no message and the terminal left in mouse mode). A release asset is run on
      # the USER's machine; it has to assume the baseline ISA.
      # `-Dversion=${{ github.ref_name }}` is what makes the installer able to
      # say "already installed": without it the binary answers `zode dev`,
      # `check_existing` compares `dev` against the tag, and every run of
      # install.sh downloads the 2 MB asset again.
      - name: Build ReleaseSmall
        run: |
          case "${{ matrix.target }}" in
            x86_64-linux)
              zig build -Doptimize=ReleaseSmall -Dstrip=true -Dtarget=x86_64-linux -Dcpu=baseline -Dversion=${{ github.ref_name }}
              ;;
            aarch64-linux)
              zig build -Doptimize=ReleaseSmall -Dstrip=true -Dtarget=aarch64-linux -Dcpu=baseline -Dversion=${{ github.ref_name }}
              ;;
            x86_64-macos)
              zig build -Doptimize=ReleaseSmall -Dstrip=true -Dtarget=x86_64-macos -Dcpu=baseline -Dversion=${{ github.ref_name }}
              ;;
            aarch64-macos)
              zig build -Doptimize=ReleaseSmall -Dstrip=true -Dtarget=aarch64-macos -Dcpu=baseline -Dversion=${{ github.ref_name }}
              ;;
          esac

      # The check that would have caught the SHA-NI artifact BEFORE it shipped.
      # It looks for instructions that only exist above the baseline ISA; a
      # baseline build has none of them (verified on the current tree: 0 hits).
      - name: Check the binary runs on a baseline CPU
        if: matrix.target == 'x86_64-linux'
        run: |
          if objdump -d zig-out/bin/zode | grep -qE '\b(sha256msg1|sha256msg2|sha256rnds2|sha1msg1|sha1msg2|vpternlogd|vpternlogq|zmm)\b'; then
            echo "::error::the binary requires CPU extensions above baseline — build with -Dcpu=baseline"
            exit 1
          fi
          echo "ok: no SHA-NI / AVX-512 instructions in the artifact"

      - name: Test (only on native linux)
        if: matrix.target == 'x86_64-linux'
        run: zig build test
        env:
          ZODE_NO_WARMUP: "1"

      - name: Prepare binary
        id: binary
        run: |
          case "${{ matrix.target }}" in
            x86_64-linux)
              PLATFORM="linux-x86_64"
              ;;
            aarch64-linux)
              PLATFORM="linux-aarch64"
              ;;
            x86_64-macos)
              PLATFORM="macos-x86_64"
              ;;
            aarch64-macos)
              PLATFORM="macos-aarch64"
              ;;
          esac
          BINARY="zig-out/bin/zode"
          ASSET_NAME="zode-${PLATFORM}"
          cp "$BINARY" "$ASSET_NAME"
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT

      # Assets are uploaded to GitHub Actions first. The publish job below is
      # the ONLY place that creates the release: a matrix job that fails used
      # to publish a partial asset set with fail-fast disabled.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: ${{ steps.binary.outputs.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish release (all four assets or nothing)
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify all four assets and write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          for a in zode-linux-x86_64 zode-linux-aarch64 zode-macos-x86_64 zode-macos-aarch64; do
            test -s "$a" || { echo "missing asset: $a" >&2; exit 1; }
          done
          sha256sum zode-* > SHA256SUMS
          cat SHA256SUMS
      - name: Upload install.sh alongside the assets
        run: cp install.sh dist/install.sh
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zode-*
            dist/SHA256SUMS
            dist/install.sh
          generate_release_notes: true
          draft: false
          # A semver prerelease tag (v0.3.0-beta.1) is published AS a prerelease:
          # GitHub's "latest release" is what install.sh and the self-update check
          # ask for, and a beta must never take that slot from the last stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Also build and test on multiple Zig versions for compatibility
  compatibility:
    name: Compatibility (Zig ${{ matrix.zig_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zig_version: ['0.17.0']
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}
      - run: zig build test
